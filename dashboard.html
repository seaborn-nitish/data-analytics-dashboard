<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">📊 Data Analytics Dashboard</div>
<div class="navbar_success">
    Dashboard Generated Successfully 🚀
</div>

<div class="container">

    <!-- Summary Cards -->
    <div class="dashboard">

        <div class="card">
            <h3>Total Rows</h3>
            <p>{{ rows }}</p>
        </div>

        <div class="card">
            <h3>Total Columns</h3>
            <p>{{ cols }}</p>
        </div>

        <div class="card">
            <h3>Status</h3>
            <p>✅ Data Processed</p>
        </div>

    </div>

    <!-- Data Preview -->
    <div class="card">
        <h2>📄 Data Preview</h2>
        <div class="table-container">
            {{ tables|safe }}
        </div>
    </div>

    <!-- Summary -->
    <div class="card">
        <h2>📊 Statistical Summary</h2>
        <div class="table-container">
            {{ summary|safe }}
        </div>
    </div>

    <!-- Graphs -->
    <div class="card">
        <h2>📈 Visualizations</h2>

        <div class="dashboard">

            <div class="chart">
                <h3>Histogram</h3>
                <img src="{{ url_for('static', filename='graphs/histogram.png') }}">
            </div>

            <div class="chart">
                <h3>Bar Chart</h3>
                <img src="{{ url_for('static', filename='graphs/bar.png') }}">
            </div>

            <div class="chart">
                <h3>Heatmap</h3>
                <img src="{{ url_for('static', filename='graphs/heatmap.png') }}">
            </div>

        </div>
    </div>

</div>



</body>
</html>
